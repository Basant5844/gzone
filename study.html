<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive PDF Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .pdf-container {
      position: relative;
      width: 100%;
      height: 100vh;
    }
    .pdf-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="pdf-container">
    <iframe src="study.pdf"></iframe>
  </div>
</body>
</html>
